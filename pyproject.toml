[project]
name = "ormai"
version = "0.2.1"
description = "Give your AI agents database access without the risk — a policy-enforced, auditable ORM runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Neul Labs", email = "contact@neullabs.com" }
]
maintainers = [
    { name = "Neul Labs", email = "contact@neullabs.com" }
]
keywords = [
    "orm", "ai", "agents", "sqlalchemy", "mcp", "llm", "tools",
    "pydantic", "database", "security", "agent-tools", "capability-runtime",
    "tenant-isolation", "audit", "access-control", "llm-tools", "tortoise",
    "peewee", "multi-tenant", "data-governance", "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pydantic",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy>=2.0,<3.0",
    "greenlet>=3.0",  # For SQLAlchemy async
]
tortoise = [
    "tortoise-orm>=0.20",
]
peewee = [
    "peewee>=3.17",
]
django = [
    "django>=5.2.15",
]
sqlmodel = [
    "sqlmodel>=0.0.14",
]
mcp = [
    "mcp>=1.0",
]
benchmark = [
    "datasets>=4.5.0",
    "rich>=13.0.0",
    "openai>=2.14.0",
    "anthropic>=0.20.0",
    "httpx>=0.25.0",
]
all = [
    "ormai[sqlalchemy,tortoise,peewee,django,sqlmodel,mcp]",
]

[project.urls]
Homepage = "https://ormai.neullabs.com"
Documentation = "https://docs.neullabs.com/ormai"
Repository = "https://github.com/neul-labs/ormai"
Issues = "https://github.com/neul-labs/ormai/issues"
Changelog = "https://github.com/neul-labs/ormai/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ormai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",  # For property-based testing
    "ruff>=0.8",
    "mypy>=1.13",
    "sqlalchemy>=2.0",  # For testing
    "greenlet>=3.0",  # For SQLAlchemy async
    "aiosqlite>=0.20",  # For async SQLite testing
    "tortoise-orm>=0.20",  # For Tortoise adapter testing
    "peewee>=3.17",  # For Peewee adapter testing
    "httpx>=0.27",  # For testing HTTP clients
    "fastapi>=0.115",  # For example app
    "uvicorn>=0.32",  # For example app
    "gdown>=5.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests", "examples"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]  # pytest fixtures often have unused arguments

[tool.ruff.lint.isort]
known-first-party = ["ormai"]

[tool.coverage.run]
source = ["src/ormai"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[[tool.mypy.overrides]]
module = [
    "ormai.adapters.django.adapter",
    "ormai.store.sqlalchemy",
    "ormai.adapters.sqlalchemy.mutations",
    "ormai.adapters.sqlalchemy.compiler",
    "ormai.store.tortoise",
    "ormai.adapters.peewee.compiler",
    "ormai.adapters.sqlalchemy.queries",
    "ormai.integrations.langgraph",
    "ormai.tools.registry",
    "ormai.adapters.tortoise.adapter",
    "ormai.adapters.tortoise.compiler",
    "ormai.adapters.sqlalchemy.adapter",
    "ormai.store.peewee",
    "ormai.policy.validation",
    "ormai.adapters.sqlalchemy.session",
    "ormai.store.django",
    "ormai.eval.replay",
    "ormai.control_plane.client",
    "ormai.views.factory",
    "ormai.store.middleware",
    "ormai.store.base",
    "ormai.mcp.server",
    "ormai.logging.config",
    "ormai.control_plane.registry",
    "ormai.control_plane.aggregator",
    "ormai.eval.harness",
    "ormai.adapters.peewee.introspection",
    "ormai.adapters.django.introspection",
]
ignore_errors = true
