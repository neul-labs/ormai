name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string
  push:
    tags:
      - 'ormai-ts-v*'

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install build tools
        run: uv pip install build twine

      - name: Validate package
        run: |
          python -m build
          twine check dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install build
        run: uv pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          draft: false
          prerelease: false

  validate-npm:
    name: Validate NPM Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ormai-ts/package-lock.json

      - name: Install dependencies
        working-directory: ormai-ts
        run: npm ci

      - name: Typecheck
        working-directory: ormai-ts
        run: npm run typecheck

      - name: Build
        working-directory: ormai-ts
        run: npm run build

      - name: Test
        working-directory: ormai-ts
        run: npm run test:run

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [validate, validate-npm]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: ormai-ts
        run: npm ci

      - name: Build packages
        working-directory: ormai-ts
        run: npm run build

      - name: Publish @ormai/core
        working-directory: ormai-ts/packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/tools
        working-directory: ormai-ts/packages/tools
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/store
        working-directory: ormai-ts/packages/store
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/utils
        working-directory: ormai-ts/packages/utils
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/prisma
        working-directory: ormai-ts/packages/prisma
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/drizzle
        working-directory: ormai-ts/packages/drizzle
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/typeorm
        working-directory: ormai-ts/packages/typeorm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/mcp
        working-directory: ormai-ts/packages/mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ormai/integrations
        working-directory: ormai-ts/packages/integrations
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
