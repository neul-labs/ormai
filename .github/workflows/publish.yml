name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - 'ormai-ts-v*'

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────
  # Python: Validate
  # ────────────────────────────────────────────────
  validate-pypi:
    name: Validate Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.ref_type == 'tag' && (
        startsWith(github.ref_name, 'v') ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install build tools
        run: uv pip install --system build twine

      - name: Validate package
        run: |
          python -m build
          twine check dist/*

  # ────────────────────────────────────────────────
  # Python: Publish to PyPI (OIDC Trusted Publishing)
  # ────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate-pypi
    if: |
      github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment:
      name: pypi
      url: https://pypi.org/project/ormai/
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install build
        run: uv pip install --system build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          draft: false
          prerelease: false

  # ────────────────────────────────────────────────
  # TypeScript: Validate
  # ────────────────────────────────────────────────
  validate-npm:
    name: Validate NPM Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.ref_type == 'tag' && (
        startsWith(github.ref_name, 'ormai-ts-v') ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ormai-ts/package-lock.json

      - name: Install dependencies
        working-directory: ormai-ts
        run: npm install

      - name: Build packages
        working-directory: ormai-ts
        run: npm run build

      - name: Typecheck
        working-directory: ormai-ts
        run: npm run typecheck

      - name: Test
        working-directory: ormai-ts
        run: npm run test

  # ────────────────────────────────────────────────
  # TypeScript: Publish to NPM (OIDC Trusted Publishing)
  # ────────────────────────────────────────────────
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: validate-npm
    if: |
      github.ref_type == 'tag' && startsWith(github.ref_name, 'ormai-ts-v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ormai/core
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing with npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ormai-ts/package-lock.json

      - name: Install dependencies
        working-directory: ormai-ts
        run: npm install

      - name: Build packages
        working-directory: ormai-ts
        run: npm run build

      - name: Publish @ormai/core
        working-directory: ormai-ts/packages/core
        run: npm publish --provenance --access public

      - name: Publish @ormai/tools
        working-directory: ormai-ts/packages/tools
        run: npm publish --provenance --access public

      - name: Publish @ormai/store
        working-directory: ormai-ts/packages/store
        run: npm publish --provenance --access public

      - name: Publish @ormai/utils
        working-directory: ormai-ts/packages/utils
        run: npm publish --provenance --access public

      - name: Publish @ormai/prisma
        working-directory: ormai-ts/packages/prisma
        run: npm publish --provenance --access public

      - name: Publish @ormai/drizzle
        working-directory: ormai-ts/packages/drizzle
        run: npm publish --provenance --access public

      - name: Publish @ormai/typeorm
        working-directory: ormai-ts/packages/typeorm
        run: npm publish --provenance --access public

      - name: Publish @ormai/mcp
        working-directory: ormai-ts/packages/mcp
        run: npm publish --provenance --access public

      - name: Publish @ormai/integrations
        working-directory: ormai-ts/packages/integrations
        run: npm publish --provenance --access public
